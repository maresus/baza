<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Zdravstveni center – Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    :root {
      --bg: #f4f7fb;
      --text: #1f2937;
      --cream: #ffffff;
      --green: #0f4c5c;
      --accent: #2a9d8f;
      --line: #e3e9f0;
      --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
    }

    .app {
      max-width: 900px;
      margin: 24px auto;
      padding: 16px;
    }

    .card {
      background: var(--cream);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.6);
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=200&q=60') center/cover no-repeat;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #4b5563;
    }

    .badge {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e6f7f4;
      color: var(--green);
      border: 1px solid #bfe9e2;
      white-space: nowrap;
    }

    .messages {
      border-radius: 18px;
      background: #fff;
      padding: 14px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .msg {
      max-width: 80%;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      border: 1px solid #f1ebe2;
    }

    .msg.user {
      margin-left: auto;
      background: #e7f4f1;
      color: var(--text);
      border-bottom-right-radius: 6px;
    }

    .msg.bot {
      margin-right: auto;
      background: #f6f9fc;
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .msg.meta {
      margin: 0 auto;
      background: transparent;
      color: #9ca3af;
      font-size: 0.75rem;
      padding: 0;
      box-shadow: none;
      border: none;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .input-main {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 70px;
      max-height: 200px;
      resize: vertical;
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      background: #fff;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px #2a9d8f40;
    }

    button {
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--green);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .hint-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
      color: #6b5f4e;
      justify-content: space-between;
      align-items: center;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid var(--line);
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--accent);
      background: #eaf8f6;
      color: var(--text);
    }

    .status {
      font-size: 0.8rem;
      color: #4b5563;
      text-align: right;
    }

    @media (max-width: 640px) {
      .card {
        padding: 14px;
      }

      .title {
        font-size: 1.05rem;
      }

      .messages {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="avatar"></div>
          <div>
            <div class="title">Zdravstveni center</div>
            <div class="subtitle">
              Vprašajte o pregledih, naročanju, cenikih ali kontaktih.
            </div>
          </div>
        </div>
          <div style="display:flex; gap:10px; align-items:center;">
          <button id="newSessionBtn" class="chip" style="cursor:pointer;">Nova seja</button>
          <div class="badge">Asistent · prisoten</div>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="input-row">
        <div class="input-main">
          <textarea
            id="input"
            placeholder="Napiši vprašanje ali npr. 'Rad bi naročil termin za dermatološki pregled.'"
          ></textarea>
          <button id="sendBtn">
            Pošlji
          </button>
        </div>
        <div class="hint-row">
          <div class="quick-prompts">
            <span class="chip" data-prompt="Kako poteka naročanje na pregled?">Naročanje</span>
            <span class="chip" data-prompt="Katere preglede in posege izvajate?">Pregledi</span>
            <span class="chip" data-prompt="Imate cenik storitev?">Cenik</span>
            <span class="chip" data-prompt="Kje se nahajate in kako do vas?">Kontakt</span>
            <span class="chip" data-prompt="Rad bi naročil termin za dermatološki pregled.">Naroči termin</span>
          </div>
          <div class="status" id="status">
            Enter = pošlji, Shift+Enter = nova vrstica
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiUrl = "/chat/"; // isti host, isti port
    const sessionKey = "chat_session_id";
    let sessionId = localStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
    }
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    const ONE_HOUR = 3600 * 1000;

    function checkChatTimeout() {
      const lastActivity = localStorage.getItem("last_chat_activity");
      const now = Date.now();
      if (lastActivity && now - Number(lastActivity) > ONE_HOUR) {
        localStorage.removeItem("chat_history");
        localStorage.removeItem(sessionKey);
        localStorage.removeItem("last_chat_activity");
        window.location.reload();
      }
    }
    checkChatTimeout();

    function renderWelcome() {
      messagesEl.innerHTML = `
        <div class="msg bot">
          Pozdravljeni v zdravstvenem centru! 😊
          <br /><br />
          Pomagam z vprašanji o pregledih, naročanju, cenikih in kontaktih.
          <br /><br />
          Poskusite:
          <br />• "Kako poteka naročanje?"
          <br />• "Katere dermatološke preglede imate?"
          <br />• "Rad bi naročil termin za pregled."
        </div>
      `;
    }
    renderWelcome();

    function addMessage(text, who = "bot") {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      localStorage.setItem("last_chat_activity", Date.now().toString());
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      inputEl.focus();

      sendBtn.disabled = true;
      statusEl.textContent = "Pošiljam zahtevo na /chat/ ...";

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });

        if (!res.ok) {
          addMessage("Napaka pri klicu /chat/ (status " + res.status + ")", "bot");
          statusEl.textContent = "Napaka pri klicu /chat/.";
        } else {
          // Parse JSON response
          const data = await res.json();
          addMessage(data.reply ?? "[Prazen odgovor]", "bot");
          statusEl.textContent = "OK – odgovor prejet.";
          localStorage.setItem("last_chat_activity", Date.now().toString());
        }
      } catch (err) {
        console.error(err);
        addMessage("Prišlo je do napake pri povezavi s strežnikom.", "bot");
        statusEl.textContent = "Napaka pri povezavi.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", () => {
      sendMessage();
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const prompt = chip.getAttribute("data-prompt");
        inputEl.value = prompt;
        inputEl.focus();
      });
    });

    document.getElementById("newSessionBtn").addEventListener("click", () => {
      localStorage.removeItem(sessionKey);
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
      localStorage.setItem("last_chat_activity", Date.now().toString());
      renderWelcome();
      statusEl.textContent = "Nova seja ustvarjena.";
    });
  </script>
</body>
</html>
